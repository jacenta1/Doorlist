[package]
name = "doorlist-contract"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Doorlist escrow: event deposits, door-signed check-ins, no-shows pay the people who came, payouts through a Sputnik DAO."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }
serde_json = "1"
ed25519-dalek = "2"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
